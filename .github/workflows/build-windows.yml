# בונה קובץ התקנה ל-Windows (CashWatch-Setup-<גרסה>.exe) בכל פעם שדוחפים תג v* (למשל v1.2.17), ומצרף אותו ל-Release.
# הכול חינמי (GitHub Actions על ריפו ציבורי). לא נבדק עדיין בפועל – ראה DEVELOPER.md §התקנה.
name: build-windows
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          check-latest: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Node נייד לחבילה
        shell: pwsh
        run: |
          $nv = (node -v).TrimStart('v')
          Invoke-WebRequest "https://nodejs.org/dist/v$nv/node-v$nv-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-dist
          node scripts/stage-windows.mjs "node-dist/node-v$nv-win-x64/node.exe"
      - name: בדיקת עשן לחבילה (טעינת הספריות עם ה-Node המובנה)
        shell: pwsh
        working-directory: build/stage
        run: |
          .\runtime\node.exe --import tsx --eval "await import('israeli-bank-scrapers'); await import('puppeteer'); await import('./src/server.ts'); await import('./src/mcp.ts'); console.log('smoke ok')"
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\cashwatch.iss
      - name: גרסה
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: checksum
        shell: pwsh
        run: |
          Get-ChildItem build\CashWatch-Setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ascii
          }
      # הקובץ נשמר גם כ-Artifact (אם נגמרה מכסת האחסון של החשבון – ממשיכים, ה-Release מספיק)
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: CashWatch-Setup
          path: build/CashWatch-Setup-*.exe
          retention-days: 7
      # Release (טיוטה) – לא נספר במכסת ה-Artifacts, ומשם מורידים את קובץ ההתקנה
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CashWatch ${{ steps.ver.outputs.version }}
          draft: true
          files: |
            build/CashWatch-Setup-*.exe
            build/CashWatch-Setup-*.exe.sha256
